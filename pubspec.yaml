name: hledger
description: A smart expense tracking app with AI categorization
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_sign_in: ^7.0.0
  # The v7 facade re-exports GoogleSignInException but not the enum its `code`
  # field is typed with, and mapping those codes to messages is the whole point
  # of catching it. Declared rather than imported through the back door.
  google_sign_in_platform_interface: ^3.1.0
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  intl: ^0.19.0
  provider: ^6.1.2
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.0
  another_telephony: ^0.4.1
  permission_handler: ^11.3.1
  home_widget: ^0.9.0
  fl_chart: ^0.69.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/hledger_icon.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/other/
    # Bundled Inter and JetBrains Mono. google_fonts finds a matching
    # `<Family>-<Weight>.ttf` in the asset manifest and loads it instead of
    # fetching, so first launch renders in the real typeface rather than
    # falling back to Roboto until the network answers.
    - assets/fonts/