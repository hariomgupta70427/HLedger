name: Supabase Keep-Alive

# Prevents the Supabase Free-tier project from pausing due to inactivity.
# Free projects pause after ~7 days of no activity; this pings daily so the
# database executes a lightweight query well within that window.

on:
  schedule:
    # Runs once every 24h at 06:00 UTC. GitHub may delay scheduled runs
    # under load, so daily (vs. weekly) keeps a wide safety margin.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # Allow manual runs from the Actions tab.

# Least privilege: this job reads nothing from the repo.
permissions: {}

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY secret."
            exit 1
          fi

          ENDPOINT="${SUPABASE_URL%/}/rest/v1/"
          echo "Pinging: ${ENDPOINT}"

          # Try several times with backoff. A paused Supabase project has its
          # DNS record removed, so early attempts may fail to resolve (curl exit
          # 6) — we keep trying to ride out transient GitHub-runner DNS blips.
          # IMPORTANT: capture curl's exit code WITHOUT letting `set -e` abort
          # here, otherwise the friendly reporting below never runs.
          HTTP_CODE="000"
          CURL_RC=1
          for attempt in 1 2 3 4 5; do
            echo "Attempt ${attempt}..."
            HTTP_CODE=$(curl -sS \
              --max-time 30 \
              -o /tmp/response.json \
              -w "%{http_code}" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Accept: application/json" \
              "${ENDPOINT}") && CURL_RC=0 || CURL_RC=$?

            echo "  curl exit=${CURL_RC}, HTTP status=${HTTP_CODE}"

            # Any real HTTP response (2xx/3xx/4xx) means PostGREST served us →
            # the project is awake and this counts as activity. Done.
            if [ "${CURL_RC}" -eq 0 ] && [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 500 ]; then
              echo "Response body:"; cat /tmp/response.json || true; echo ""
              echo "::notice::Supabase keep-alive ping succeeded (HTTP ${HTTP_CODE})."
              exit 0
            fi

            # Not yet — wait and retry (10s, 20s, 30s, 40s).
            if [ "${attempt}" -lt 5 ]; then
              sleep $(( attempt * 10 ))
            fi
          done

          # All attempts failed. curl exit 6 = DNS could not resolve, which for
          # Supabase almost always means the project is PAUSED (its DNS record
          # is pulled while paused). A keep-alive ping CANNOT wake a paused
          # project — you must resume it once in the Supabase dashboard, after
          # which these daily pings keep it awake.
          if [ "${CURL_RC}" -eq 6 ]; then
            echo "::error::Supabase host did not resolve (curl 6) after retries — the project is almost certainly PAUSED. Resume it once at https://supabase.com/dashboard (Project → Resume); daily pings keep it awake thereafter."
          else
            echo "::error::Supabase unreachable (curl exit ${CURL_RC}, HTTP ${HTTP_CODE}) after retries — project may be paused or the SUPABASE_URL secret is wrong."
          fi
          exit 1
