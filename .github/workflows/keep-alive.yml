name: Supabase Keep-Alive

# Prevents the Supabase Free-tier project from pausing due to inactivity.
# Free projects pause after ~7 days of no activity; this pings daily so the
# database executes a lightweight query well within that window.

on:
  schedule:
    # Runs once every 24h at 06:00 UTC. GitHub may delay scheduled runs
    # under load, so daily (vs. weekly) keeps a wide safety margin.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # Allow manual runs from the Actions tab.

# Least privilege: this job reads nothing from the repo.
permissions: {}

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY secret."
            exit 1
          fi

          # Hit the REST root — it always exists (returns the OpenAPI spec) and
          # does not depend on any table or RLS policy. What matters for
          # keep-alive is that the database/PostgREST actually serves the
          # request, so we treat ANY genuine HTTP response as "project awake".
          ENDPOINT="${SUPABASE_URL%/}/rest/v1/"
          echo "Pinging: ${ENDPOINT}"

          HTTP_CODE=$(curl -sS \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 30 \
            -o /tmp/response.json \
            -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "${ENDPOINT}")

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body:"
          cat /tmp/response.json || true
          echo ""

          # Any 2xx/4xx means PostgREST served the request → the project is
          # awake and this counts as activity. 000 (curl couldn't connect) or
          # 5xx means the project is paused/unreachable — fail so we get alerted.
          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 500 ]; then
            echo "::notice::Supabase keep-alive ping succeeded (HTTP ${HTTP_CODE})."
          else
            echo "::error::Supabase unreachable (HTTP ${HTTP_CODE}) — project may be PAUSED. Resume it once in the Supabase dashboard; daily pings keep it awake thereafter."
            exit 1
          fi
