org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
# Kotlin is pinned to JVM target 17 for every subproject (firebase_auth needs 17,
# home_widget can't go below 11) while some plugins leave Java on AGP's default.
# The mismatch is safe with desugaring enabled, so downgrade the check to a warning.
kotlin.jvm.target.validation.mode=warning